<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Portal de Instalaciones</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    
</head>
<body class="page-index" data-page="index" data-auth="login">

<div class="login-card">
    <img src="assets/img/claro-logo.svg" alt="Claro" class="claro-logo-login">
    
    <h2>Portal de Procesos</h2>
    <p class="subtitle">Instalaciones | Control de Acceso</p>

    <form>
        <div class="text-start mb-3">
            <label class="form-label">Usuario Correo</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input type="email" class="form-control" placeholder="ejemplo@claro.com.ar" required>
            </div>
        </div>
        
        <div class="text-start mb-4">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-login">Ingresar al Portal</button>
    </form>

    <div class="footer-text">
        <i class="fa-solid fa-shield-halved me-1"></i> Acceso Restringido y Monitoreado<br>
        &copy; 2026 Claro Argentina
    </div>
</div>

    <script type="module" src="js/login.js"></script>
</body>
</html>

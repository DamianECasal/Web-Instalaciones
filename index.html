<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Portal de Instalaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --claro-red: #d93025;
            --dark-gray: #333;
            --light-bg: #f8f9fa;
        }

        body {
            background: var(--light-bg);
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-header {
            background-color: var(--claro-red);
            margin: -40px -40px 30px -40px;
            padding: 30px;
            border-radius: 15px 15px 0 0;
            color: white;
        }

        .login-header i {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .login-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .form-control:focus {
            border-color: var(--claro-red);
            box-shadow: 0 0 0 0.25 red;
        }

        .btn-login {
            background-color: var(--claro-red);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #b2251b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(217, 48, 37, 0.3);
        }

        .footer-text {
            margin-top: 20px;
            color: #888;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="fa-solid fa-lock"></i>
        <h2>Portal de Procesos</h2>
    </div>

    <form action="pages/portada.html"> <div class="text-start mb-3">
            <label class="form-label fw-bold small text-muted">USUARIO CORREO</label>
            <input type="email" class="form-control" placeholder="nombre@empresa.com" required>
        </div>
        
        <div class="text-start mb-4">
            <label class="form-label fw-bold small text-muted">CONTRASEÑA</label>
            <input type="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
    </form>

    <p class="footer-text">
        &copy; 2026 Instalaciones | Acceso Restringido
    </p>
</div>

<script type="module">
    // Importamos la librería de Supabase
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // REEMPLAZA CON TUS DATOS DE "PROJECT SETTINGS > API"
    const supabaseUrl = 'https://eljykdmzjsdkpojpalen.supabase.co'
    const supabaseKey = 'sb_publishable_ABlaHEC7sMgmFQAg5h5wBg_P5-I6TBs'
    const supabase = createClient(supabaseUrl, supabaseKey)

    const loginForm = document.querySelector('form');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Obtenemos los datos de los inputs que ya tenés en tu diseño
        const email = loginForm.querySelector('input[type="email"]').value;
        const password = loginForm.querySelector('input[type="password"]').value;

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            alert("Acceso denegado: " + error.message);
        } else {
            // Si el login es exitoso, nos vamos al index.html
            window.location.href = "pages/portada.html";
        }
    });
</script>

</body>
</html>

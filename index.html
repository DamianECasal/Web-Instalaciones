<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Portal de Instalaciones</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --claro-red: #d93025;
            --claro-dark: #333333;
            --claro-gray: #f8f9fa;
        }

        body {
            background-color: var(--claro-gray);
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            /* Fondo sutil con el rojo de Claro */
            background: linear-gradient(180deg, #d93025 0%, #d93025 30%, #f8f9fa 30%, #f8f9fa 100%);
        }

        .login-card {
            background: white;
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: none;
        }

        .claro-logo-login {
            width: 140px;
            margin-bottom: 25px;
        }

        .login-card h2 {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--claro-dark);
            margin-bottom: 8px;
            text-transform: none;
        }

        .subtitle {
            color: #777;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            background-color: #fff;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--claro-red);
            box-shadow: 0 0 0 3px rgba(238, 18, 44, 0.1);
            outline: none;
        }

        .btn-login {
            background-color: var(--claro-red);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 14px;
            width: 100%;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #d10f26;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(238, 18, 44, 0.3);
            color: white;
        }

        .footer-text {
            margin-top: 30px;
            color: #999;
            font-size: 0.8rem;
        }

        /* Ajuste para iconos en los inputs */
        .input-group-text {
            background: transparent;
            border-right: none;
            color: #999;
        }
        .input-group .form-control {
            border-left: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <img src="assets/img/claro-logo.svg" alt="Claro" class="claro-logo-login">
    
    <h2>Portal de Procesos</h2>
    <p class="subtitle">Instalaciones | Acceso Técnico</p>

    <form>
        <div class="text-start mb-3">
            <label class="form-label">Usuario Correo</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input type="email" class="form-control" placeholder="ejemplo@claro.com.ar" required>
            </div>
        </div>
        
        <div class="text-start mb-4">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-login">Ingresar al Portal</button>
    </form>

    <div class="footer-text">
        <i class="fa-solid fa-shield-halved me-1"></i> Acceso Restringido y Monitoreado<br>
        &copy; 2026 Claro Argentina
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // Datos de Supabase (Mantenidos de tu código original)
    const supabaseUrl = 'https://eljykdmzjsdkpojpalen.supabase.co'
    const supabaseKey = 'sb_publishable_ABlaHEC7sMgmFQAg5h5wBg_P5-I6TBs'
    const supabase = createClient(supabaseUrl, supabaseKey)

    const loginForm = document.querySelector('form');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = loginForm.querySelector('input[type="email"]').value;
        const password = loginForm.querySelector('input[type="password"]').value;

        // Mostrar un estado de carga en el botón (opcional pero profesional)
        const btn = loginForm.querySelector('.btn-login');
        const originalText = btn.innerText;
        btn.innerText = "VERIFICANDO...";
        btn.disabled = true;

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            alert("Acceso denegado: " + error.message);
            btn.innerText = originalText;
            btn.disabled = false;
        } else {
            // Éxito: Redirigir a la portada
            window.location.href = "pages/portada.html";
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Portal de Instalaciones</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --red:        #ee122c;
            --red-dark:   #a50d1f;
            --red-deeper: #7a0915;
            --white:      #ffffff;
            --off-white:  #f8f9fa;
            --text:       #1a1a1a;
            --text-muted: #666;
            --border:     #ebebeb;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--off-white);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ── FONDO ESTILO HERO ── */
        .bg-hero {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 45vh;
            background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 55%, var(--red-deeper) 100%);
            z-index: 0;
            overflow: hidden;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }
        
        .hero-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
        }
        .hero-ring-1 { width: 600px; height: 600px; top: -250px; right: -150px; }
        .hero-ring-2 { width: 300px; height: 300px; bottom: -100px; left: -100px; }

        /* ── CONTENEDOR LOGIN ── */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        .login-card {
            background: var(--white);
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .claro-logo-login {
            width: 130px;
            display: block;
            margin: 0 auto 28px auto;
        }

        .login-card h2 {
            font-weight: 900;
            font-size: 1.6rem;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* ── FORMULARIO ── */
        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            display: block;
        }

        .input-group {
            background: #f4f4f4;
            border: 1.5px solid transparent;
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .input-group:focus-within {
            background: white;
            border-color: var(--red);
            box-shadow: 0 0 0 4px rgba(238, 18, 44, 0.1);
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: #aaa;
            padding-left: 18px;
            font-size: 1.1rem;
        }

        .input-group:focus-within .input-group-text {
            color: var(--red);
        }

        .form-control {
            background: transparent;
            border: none;
            padding: 14px 16px 14px 12px;
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 500;
        }
        
        .form-control:focus {
            background: transparent;
            box-shadow: none;
            outline: none;
        }

        .form-control::placeholder {
            color: #bbb;
            font-weight: 400;
        }

        /* ── BOTÓN ── */
        .btn-login {
            background-color: var(--red);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            width: 100%;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            background-color: var(--red-dark);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(238, 18, 44, 0.25);
        }
        
        .btn-login:disabled {
            background-color: #fca5a5;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ── ENLACE DE REGISTRO ── */
        .register-link {
            display: block;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s ease;
        }

        .register-link strong {
            color: var(--text);
            transition: 0.3s ease;
        }

        .register-link:hover, .register-link:hover strong {
            color: var(--red);
        }

        /* ── FOOTER INTERNO ── */
        .footer-text {
            margin-top: 32px;
            color: #999;
            font-size: 0.75rem;
            line-height: 1.6;
            font-weight: 500;
        }
        .footer-text i {
            color: var(--border);
            font-size: 1rem;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>
<body>

<div class="bg-hero">
    <div class="hero-ring hero-ring-1"></div>
    <div class="hero-ring hero-ring-2"></div>
</div>

<div class="login-wrapper">
    <div class="login-card">
        
        <img src="assets/img/claro-logo.svg" alt="Claro" class="claro-logo-login" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/e/ee/Logo_claro_amp.svg'">
        
        <h2>Control de Acceso</h2>
        <p class="subtitle">Ingresá tus credenciales para acceder al portal de Instalaciones.</p>

        <form>
            <div class="text-start mb-4">
                <label class="form-label">Usuario Correo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="ejemplo@claro.com.ar" required>
                </div>
            </div>
            
            <div class="text-start mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Ingresar al Portal <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <!-- ENLACE A REGISTRO -->
        <a href="registro.html" class="register-link">
            ¿No tenés cuenta? <strong>Solicitar acceso</strong>
        </a>

        <div class="footer-text">
            <i class="fa-solid fa-shield-halved"></i>
            Acceso Restringido y Monitoreado<br>
            &copy; 2026 Claro Argentina
        </div>
        
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // Datos de Supabase
    const supabaseUrl = 'https://eljykdmzjsdkpojpalen.supabase.co'
    const supabaseKey = 'sb_publishable_ABlaHEC7sMgmFQAg5h5wBg_P5-I6TBs'
    const supabase = createClient(supabaseUrl, supabaseKey)

    const loginForm = document.querySelector('form');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = loginForm.querySelector('input[type="email"]').value;
        const password = loginForm.querySelector('input[type="password"]').value;

        // Mostrar estado de carga en el botón
        const btn = loginForm.querySelector('.btn-login');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = 'Verificando <i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            alert("Acceso denegado: " + error.message);
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        } else {
            // Éxito: Redirigir a la portada principal
            window.location.href = "pages/portada.html";
        }
    });
</script>

</body>
</html>

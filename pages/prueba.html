<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Instalaciones - Panel Principal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --claro-red: #d93025;
            --dark-gray: #333;
            --light-bg: #f8f9fa;
        }

        body {
            background: var(--light-bg);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* --- ENCABEZADO COMPACTO --- */
        .header-section {
            background-color: var(--claro-red);
            color: white;
            padding: 25px 20px; /* Un poco más compacto */
            text-align: center;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 50px;
            position: relative;
        }

        .header-section h2 {
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
        }

        .welcome-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            margin-top: 5px;
            font-weight: 300;
        }

        .btn-logout {
            position: absolute;
            top: 50%;
            right: 25px;
            transform: translateY(-50%);
            color: white;
            border: 1px solid white;
            background: rgba(255,255,255,0.1);
            padding: 6px 15px;
            border-radius: 8px;
            font-size: 0.75rem;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            text-decoration: none;
        }

        .btn-logout:hover {
            background: white;
            color: var(--claro-red);
        }

        /* --- CONTENEDOR Y TARJETAS --- */
        .main-container {
            max-width: 1200px; /* Aumentado para que quepan bien los 4 en fila */
            margin: 0 auto;
            padding: 20px;
            flex-grow: 1;
        }

        .btn-card {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 40px 15px;
            text-align: center;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: 100%; /* Para que todas midan lo mismo */
            border-bottom: 5px solid transparent;
        }

        .btn-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-bottom: 5px solid var(--claro-red);
        }

        .btn-card i {
            font-size: 3rem;
            color: var(--claro-red);
            margin-bottom: 20px;
        }

        .btn-card span {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--dark-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        footer {
            padding: 30px;
            text-align: center;
        }

        /* Ajuste para móviles: el botón de logout se mueve arriba si la pantalla es chica */
        @media (max-width: 768px) {
            .btn-logout {
                position: static;
                transform: none;
                display: inline-block;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>

<div class="header-section">
    <a href="#" id="logoutBtn" class="btn-logout">Cerrar Sesión</a>
    <h2>PORTAL DE PROCESOS - INSTALACIONES</h2>
    <p class="welcome-text">Selecciona el módulo al que deseas acceder</p>
</div>

<div class="container-fluid main-container">
    <div class="row g-4 justify-content-center">
        
        <div class="col-12 col-sm-6 col-lg-3">
            <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=d-q_BZzxHUevogyQk6-L21t82VfgGdlMn5zt3SGmW0tUOElOU0UyRUhUVUVPSVFDT1VFNjU0WDFWNC4u" target="_blank" class="btn-card">
                <i class="fa-solid fa-file-lines"></i>
                <span>FORMS FALLIDAS</span>
            </a>
        </div>  

        <div class="col-12 col-sm-6 col-lg-3">
            <a href="https://app.powerbi.com/groups/me/reports/f3bfd376-e1c9-4a31-99d3-e3d8091f90a3/48ee80cf50c305d0b56a?ctid=05bfea77-f19c-471d-afa2-0c9093af8bdb&experience=power-bi" target="_blank" class="btn-card">
                <i class="fa-solid fa-chart-line"></i>
                <span>FALLIDAS BI</span>
            </a>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <a href="instructivos.html" class="btn-card">
                <i class="fa-solid fa-clipboard-list"></i>
                <span>INSTRUCTIVOS Y PROCESOS</span>
            </a>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSf2i42-j01TRr8yBrT-J9zOinHyRr7k704hvZA33NU22WXwbw/viewform" target="_blank" class="btn-card">
                <i class="fa-solid fa-file-export"></i>
                <span>CARGA DE REGULARIZACIONES</span>
            </a>
        </div> 

    </div>

    <footer class="text-muted small">
        &copy; 2026 Portal de procesos Instalaciones | Acceso Restringido
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://eljykdmzjsdkpojpalen.supabase.co'
    const supabaseKey = 'sb_publishable_ABlaHEC7sMgmFQAg5h5wBg_P5-I6TBs'
    const supabase = createClient(supabaseUrl, supabaseKey)

    async function validarAcceso() {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session) {
            window.location.href = "../index.html";
        }
    }
    validarAcceso();

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        const { error } = await supabase.auth.signOut();
        if (!error) {
            window.location.href = "../index.html";
        } else {
            alert("Error al cerrar sesión");
        }
    });
</script>

</body>
</html>

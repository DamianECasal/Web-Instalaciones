<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Instalaciones - Claro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --claro-red: #ee122c; /* El rojo oficial exacto */
            --claro-gray: #f2f2f2;
            --claro-dark: #333333;
            --claro-blue: #0082c9;
        }

        body {
            background-color: white;
            font-family: 'Roboto', sans-serif;
            color: var(--claro-dark);
            margin: 0;
        }

        /* --- NAVBAR ESTILO CLARO --- */
        .navbar-claro {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
            background: white;
        }

        .claro-logo {
            height: 45px;
        }

        /* --- HERO SECTION --- */
        .hero-section {
            background: linear-gradient(135deg, #ee122c 0%, #a50d1f 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-bottom-left-radius: 50% 20px;
            border-bottom-right-radius: 50% 20px;
        }

        .hero-section h2 {
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* --- CONTENEDOR DE TARJETAS --- */
        .main-container {
            max-width: 1100px;
            margin: -40px auto 50px; /* Sube las tarjetas sobre el hero */
            padding: 0 20px;
        }

        .btn-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
            transition: all 0.25s ease-in-out;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .btn-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-color: var(--claro-red);
            color: inherit;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: var(--claro-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .btn-card:hover .icon-circle {
            background-color: #ffeaea;
        }

        .btn-card i {
            font-size: 2rem;
            color: var(--claro-red);
        }

        .btn-card span {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--claro-dark);
            text-transform: none;
            line-height: 1.3;
        }

        .btn-logout {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 500;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: white;
            color: var(--claro-red);
        }

        footer {
            background: var(--claro-gray);
            padding: 40px 0;
            margin-top: 50px;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 768px) {
            .hero-section { padding: 40px 20px 60px; }
            .hero-section h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<nav class="navbar-claro">
    <div class="container d-flex justify-content-between align-items-center">
        <img src="../assets/img/claro-logo.svg" alt="Claro" class="claro-logo">
        <a href="#" id="logoutBtn" class="btn-logout" style="color: var(--claro-red); border-color: var(--claro-red);">Cerrar Sesión</a>
    </div>
</nav>

<div class="hero-section">
    <div class="container">
        <h2>PORTAL DE PROCESOS Y HERRAMIENTAS</h2>
        <p class="lead">Gestión de Instalaciones y Seguimiento</p>

    </div>
</div>

<div class="main-container">
    <div class="row g-4 justify-content-center">
        
        <div class="col-12 col-md-6 col-lg-3">
            <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=d-q_BZzxHUevogyQk6-L21t82VfgGdlMn5zt3SGmW0tUOElOU0UyRUhUVUVPSVFDT1VFNjU0WDFWNC4u" target="_blank" class="btn-card">
                <div class="icon-circle">
                    <i class="fa-solid fa-file-circle-exclamation"></i>
                </div>
                <span>Forms Fallidas</span>
            </a>
        </div>  

        <div class="col-12 col-md-6 col-lg-3">
            <a href="https://app.powerbi.com/groups/me/reports/f3bfd376-e1c9-4a31-99d3-e3d8091f90a3/48ee80cf50c305d0b56a?ctid=05bfea77-f19c-471d-afa2-0c9093af8bdb&experience=power-bi" target="_blank" class="btn-card">
                <div class="icon-circle">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <span>Dashboard BI</span>
            </a>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <a href="instructivos.html" class="btn-card">
                <div class="icon-circle">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <span>Instructivos</span>
            </a>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSf2i42-j01TRr8yBrT-J9zOinHyRr7k704hvZA33NU22WXwbw/viewform" target="_blank" class="btn-card">
                <div class="icon-circle">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <span>Regularizaciones</span>
            </a>
        </div> 

    </div>
</div>

<footer class="text-center text-muted">
    <div class="container">
        <p class="mb-1">© 2026 Claro Argentina | Todos los derechos reservados</p>  
        <p class="small">Uso exclusivo para personal técnico autorizado de Instalaciones.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://eljykdmzjsdkpojpalen.supabase.co'
    const supabaseKey = 'sb_publishable_ABlaHEC7sMgmFQAg5h5wBg_P5-I6TBs'
    const supabase = createClient(supabaseUrl, supabaseKey)

    async function validarAcceso() {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session) {
            window.location.href = "../index.html";
        }
    }
    validarAcceso();

    const logoutAction = async (e) => {
        e.preventDefault();
        const { error } = await supabase.auth.signOut();
        if (!error) {
            window.location.href = "../index.html";
        } else {
            alert("Error al cerrar sesión");
        }
    };

    document.getElementById('logoutBtn').addEventListener('click', logoutAction);
    document.getElementById('logoutBtnHero').addEventListener('click', logoutAction);
</script>

</body>
</html>

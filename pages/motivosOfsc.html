<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Motivos OFSC - Claro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">

    
</head>
<body class="page-motivosOfsc" data-page="motivosofsc" data-auth="required">

<nav class="navbar-claro">
    <div class="container d-flex justify-content-between">
        <img src="../assets/img/claro-logo.svg" alt="Claro" class="claro-logo">
        <span class="badge rounded-pill bg-light text-dark border align-self-center small">Manual de Cierres</span>
    </div>
</nav>

<header class="hero-section">
    <div class="container">
        <a href="#" class="btn-back" data-go-back><i class="fas fa-arrow-left"></i></a>
        <h2 class="header-title">MOTIVOS DE CIERRES OFSC</h2>
        <p class="opacity-75 small mt-2 uppercase">Guía de escenarios y procesos</p>
    </div>
</header>

<main class="main-content">
    <div class="controls-card shadow-sm">
        <div class="row g-3 align-items-center">
            <div class="col-md-6">
                <div class="input-group border rounded-pill px-3 py-1">
                    <span class="input-group-text bg-transparent border-0"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control border-0 bg-transparent" placeholder="Que motivo estas buscando el dia de hoy...">
                </div>
            </div>
            <div class="col-md-6 text-md-end text-center">
                <div class="nav nav-pills justify-content-md-end justify-content-center">
                    <button class="nav-link active btn-todos" data-motive-filter="all">Todos</button>
                    <button class="nav-link btn-no-realizada" data-motive-filter="no-realizada">No Realizadas</button>
                    <button class="nav-link btn-realizada" data-motive-filter="realizada">Realizadas</button>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3" id="motivesGrid"></div>
</main>

<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content shadow-lg">
            <div class="modal-header text-white" id="modalHeader">
                <h5 class="modal-title fw-bold" id="motiveTitle"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="section-title">1. Descripción del Escenario</div>
                <ul id="motiveDesc" class="modal-list"></ul>
                
                <div class="section-title">2. Pasos Obligatorios</div>
                <ul id="motiveSteps" class="modal-list"></ul>

                <div class="section-title">3. Evidencia Fotográfica (TOA)</div>
                <ul id="motivePhotos" class="modal-list"></ul>

                <div class="section-title">4. Provisión y Gestión de Stock</div>
                <div id="motiveStock" class="stock-box mb-3"></div>

                <div class="section-title">5. Notas Adicionales</div>
                <ul id="motiveNotes" class="modal-list"></ul>
            </div>
        </div>
    </div>
</div>

<footer>&copy; 2026 Claro Argentina</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/login.js"></script>
    <script type="module" src="../js/efectos.js"></script>
</body>
</html>

            padding: 0 15px;
            position: relative;

        .controls-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 45px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .nav-pills .nav-link {
            color: #666; font-weight: 700; border: 1px solid #ddd;
            margin: 0 5px; border-radius: 25px; padding: 8px 20px;
            font-size: 0.85rem; transition: 0.3s; background: white;
        }
        .btn-todos.active { background-color: var(--claro-blue) !important; color: white; }
        .btn-no-realizada.active { background-color: var(--claro-red) !important; color: white; }
        .btn-realizada.active { background-color: var(--success-green) !important; color: white; }

        /* --- TARJETAS --- */
        .motive-card { 
            cursor: pointer; 
            transition: 0.3s; 
            border: 1px solid #eee;
            border-left: 6px solid var(--claro-red);
            height: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .motive-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); }
        .motive-card.realizada { border-left-color: var(--success-green); }

        .text-truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .modal-body { padding: 30px; }

            font-weight: 800; color: #000000; margin-top: 25px; text-transform: uppercase;

        }

        .modal-list li { 
            margin-bottom: 10px; color: #444; font-size: 0.95rem; line-height: 1.5;

        }

            width: 8px;
            height: 8px;
            background-color: black;
            border-radius: 50%;
            display: inline-block;
            margin-right: 15px;

            background: #fff3f3;

            font-size: 0.9rem;

    function renderMotives(data) {
        const grid = document.getElementById('motivesGrid');
        grid.innerHTML = '';
        data.forEach(m => {
            const card = `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="card motive-card p-3 ${m.type === 'realizada' ? 'realizada' : ''}" onclick="showDetail(${m.id})">
                        <div class="d-flex flex-column h-100">
                            <h6 class="mb-2 text-truncate-2">${m.title}</h6>
                            <div class="mt-auto">
                                <span class="badge ${m.type === 'realizada' ? 'bg-success' : 'bg-danger'} badge-type">
                                    ${m.type === 'realizada' ? 'Realizada' : 'No Realizada'}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>`;
            grid.innerHTML += card;
        });
    }

    // FUNCIÓN PARA GENERAR LISTA CON PUNTOS NEGROS
    function mapToDotList(array) {
        return array.map(item => `<li><span class="dot-indicator"></span>${item}</li>`).join('');
    }

    function showDetail(id) {
        const m = motives.find(item => item.id === id);
        if(!m) return;
        document.getElementById('motiveTitle').innerText = m.title;
        document.getElementById('motiveStock').innerText = m.stock;
        
        document.getElementById('motiveDesc').innerHTML = mapToDotList(m.desc);
        document.getElementById('motiveSteps').innerHTML = mapToDotList(m.steps);
        document.getElementById('motivePhotos').innerHTML = mapToDotList(m.photos);
        document.getElementById('motiveNotes').innerHTML = mapToDotList(m.notes);
        
        const header = document.getElementById('modalHeader');
        header.style.backgroundColor = m.type === 'realizada' ? 'var(--success-green)' : 'var(--claro-red)';
        new bootstrap.Modal(document.getElementById('detailModal')).show();
    }

    function filterMotives(type, btn) {
        document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (type === 'all') renderMotives(motives);
        else renderMotives(motives.filter(m => m.type === type));
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        renderMotives(motives.filter(m => m.title.toLowerCase().includes(term)));
    });

    renderMotives(motives);
</script>
